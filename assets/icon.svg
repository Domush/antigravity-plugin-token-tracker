<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tt-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#24C1E0" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Rounded Badge Surface & Border -->
  <rect width="128" height="128" rx="28" fill="#1e1e2e" />
  <rect x="8" y="8" width="112" height="112" rx="22" fill="none" stroke="url(#tt-grad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Outer Concentric Gauge (6 o'clock start) -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="#2d2f45" stroke-width="8" />
  <circle cx="64" cy="64" r="36" fill="none" stroke="url(#tt-grad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="163 227" transform="rotate(90 64 64)" />

  <!-- Inner Secondary Accent Gauge (6 o'clock start) -->
  <circle cx="64" cy="64" r="24" fill="none" stroke="#26283b" stroke-width="5" />
  <circle cx="64" cy="64" r="24" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-dasharray="72 151" transform="rotate(90 64 64)" />

  <!-- Centered Lightning Bolt Core -->
  <path d="M67 48 L56 65 L64 65 L61 80 L74 62 L66 62 Z" fill="#ffffff" />
</svg>
