<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Tracker Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="pulse-dot" id="tt-live-dot"></span>
      <span>⚡ Token Tracker</span>
      <span class="badge" id="tt-dash-version">--</span>
    </div>
    <div class="header-actions">
      <button
        class="btn"
        id="tt-sub-mode-btn"
        type="button"
        aria-pressed="false"
        title="Toggle active subagent cards between text metrics and circular rings"
      >Subagents: Text</button>
      <button class="btn" id="tt-refresh-btn" type="button" title="Refresh telemetry">↻</button>
    </div>
  </header>

  <section class="quota-strip" aria-label="Model Quotas">
    <div class="q-card">
      <div class="q-label" title="Gemini 5-Hour">Gemini 5-Hour</div>
      <div class="q-row">
        <span class="q-pct" id="tt-g5h-pct">--%</span>
        <span class="q-reset" id="tt-g5h-reset">--</span>
      </div>
      <div class="micro-bar"><div class="micro-fill" id="tt-g5h-bar"></div></div>
    </div>
    <div class="q-card">
      <div class="q-label" title="Gemini Weekly">Gemini Weekly</div>
      <div class="q-row">
        <span class="q-pct" id="tt-gwk-pct">--%</span>
        <span class="q-reset" id="tt-gwk-reset">--</span>
      </div>
      <div class="micro-bar"><div class="micro-fill" id="tt-gwk-bar"></div></div>
    </div>
    <div class="q-card">
      <div class="q-label" title="Claude/GPT 5-Hour">Claude/GPT 5-Hour</div>
      <div class="q-row">
        <span class="q-pct" id="tt-3p5h-pct">--%</span>
        <span class="q-reset" id="tt-3p5h-reset">--</span>
      </div>
      <div class="micro-bar"><div class="micro-fill" id="tt-3p5h-bar"></div></div>
    </div>
    <div class="q-card">
      <div class="q-label" title="Claude/GPT Weekly">Claude/GPT Weekly</div>
      <div class="q-row">
        <span class="q-pct" id="tt-3pwk-pct">--%</span>
        <span class="q-reset" id="tt-3pwk-reset">--</span>
      </div>
      <div class="micro-bar"><div class="micro-fill" id="tt-3pwk-bar"></div></div>
    </div>
  </section>

  <div class="section-head">
    <span>Active Agents</span>
    <span id="tt-agents-counts">0 Main · 0 Active Subagents</span>
  </div>

  <main class="tree-list" id="tt-tree-root"></main>

  <script src="/preload.js"></script>
  <script src="/cards.js"></script>
  <script src="/app.js"></script>
</body>
</html>
